# Thin caller — cuts the GitHub Release whose body is this tag's CHANGELOG section.
# The logic lives once in dpyc-community/.github/workflows/github-release.yml; that
# file explains why (18 copies, 8 of them divergent, two silent extractor bugs).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: lonniev/dpyc-community/.github/workflows/github-release.yml@main
    secrets: inherit
